services:
  - type: web
    name: sentinel-x-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./sentinel_x.db
      - key: FRONTEND_URL
        sync: false
